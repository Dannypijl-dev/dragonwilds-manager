name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: dragonwilds-manager --version

  windows-build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[desktop] pyinstaller pywin32
      - run: pyinstaller packaging/windows/dragonwilds-manager.spec
      - name: Smoke test the exe (panel answers, server install starts)
        shell: pwsh
        run: |
          $env:DWM_DATA_DIR = "$env:RUNNER_TEMP\dwm"
          & dist\dragonwilds-manager.exe --version
          # the windowed exe has no console, so --version prints nothing: it only has to exit 0
          & dist\dragonwilds-manager-app.exe --version
          if ($LASTEXITCODE -ne 0) { throw "dragonwilds-manager-app.exe failed ($LASTEXITCODE)" }
          $p = Start-Process -FilePath dist\dragonwilds-manager.exe -ArgumentList "run","--port","8085" -PassThru -NoNewWindow -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:8085/setup -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
          }
          Get-Content out.log, err.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $ok) { throw "panel did not answer (exited: $($p.HasExited))" }
          Stop-Process $p -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dragonwilds-manager-windows
          path: |
            dist/dragonwilds-manager.exe
            dist/dragonwilds-manager-app.exe

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t dragonwilds-manager:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name dwm -p 8085:8080 dragonwilds-manager:ci
          sleep 8
          curl -fsS http://127.0.0.1:8085/setup >/dev/null
          docker rm -f dwm
