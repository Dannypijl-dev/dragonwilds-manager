[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonwilds-manager"
version = "0.1.2"
description = "Web panel to create and run RuneScape: Dragonwilds dedicated servers on Windows, Linux or Docker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["flask>=2.3", "waitress>=2.1", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dragonwilds-manager = "dwmanager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dwmanager = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
